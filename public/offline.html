<!doctype html>
<html lang="es-CU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f4c75" />
    <meta name="robots" content="noindex" />
    <title>Sin conexión · ComboYa</title>
    <!-- Página autocontenida (sin JS ni CSS externos): la sirve el service worker sin red. -->
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #f8fafc;
        color: #0f172a;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          Arial,
          sans-serif;
        text-align: center;
      }
      main {
        max-width: 26rem;
        padding: 1.5rem;
      }
      .icono {
        width: 4rem;
        height: 4rem;
        margin: 0 auto 1rem;
        border-radius: 1rem;
        background: #0f4c75;
        display: grid;
        place-items: center;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.75rem;
      }
      p {
        color: #475569;
        line-height: 1.5;
        margin: 0 0 1.5rem;
      }
      a {
        display: inline-block;
        background: #0f4c75;
        color: #fff;
        text-decoration: none;
        font-weight: 600;
        padding: 0.75rem 1.25rem;
        border-radius: 0.75rem;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="icono" aria-hidden="true">
        <svg
          width="32"
          height="32"
          viewBox="0 0 24 24"
          fill="none"
          stroke="#fff"
          stroke-width="2"
          stroke-linecap="round"
        >
          <path
            d="M2 8.8a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16.1a5 5 0 0 1 7 0M12 20h.01M3 3l18 18"
          />
        </svg>
      </div>
      <h1>No hay conexión</h1>
      <p>
        Revise sus datos móviles o el wifi. Su carrito sigue guardado en este teléfono: cuando
        vuelva la conexión podrá terminar el pedido.
      </p>
      <a href="/">Reintentar</a>
    </main>
  </body>
</html>
